<!-- Noise Reducer -->

{% extends 'template.html' %}

{% block title %}Image Cleaner{% endblock %}

{% block bodytag %} data-page="NR" {% endblock %}
{% block content %}
<div class="row">
    <!-- Left Side: Upload Area -->
    <div class="col-md-3">
        <h2>Noise Reducer</h2>
        <div class="upload-area" id="uploadfile">
            <div class="upload-icon">
                <i class="fas fa-cloud-upload-alt fa-3x"></i>
            </div>
            <h3>Drag & Drop or Click to Upload Image</h3>
            <input type="file" id="fileInput" accept="image/*">
        </div>
    </div>

    <!-- Right Side: Comparison -->
    <div class="col-md-9">
        <!-- Comparison container -->
        <div id="comparison-container" class="comparison-container hidden">
            <p class="comparison-hint"><i class="fas fa-search"></i> Hover to compare</p>
            <div class="comparison-row">
                <!-- Original Image -->
                <div class="comparison-pane" id="original-pane">
                    <h4>Original</h4>
                    <div class="magnify-wrapper" data-pair="compare">
                        <img id="preview" src="" alt="Original Image" class="img-fluid">
                        <div class="magnifier-lens"></div>
                    </div>
                </div>
                <!-- Processed Image -->
                <div class="comparison-pane" id="result-pane">
                    <h4>Cleaned</h4>
                    <div class="magnify-wrapper" data-pair="compare">
                        <img id="output" src="" alt="Cleaned Image" class="img-fluid">
                        <div class="magnifier-lens"></div>
                    </div>
                </div>
            </div>
            <a id="download-btn" href="" download="cleaned.png" class="btn btn-primary mt-3 hidden">Download</a>
        </div>

        <!-- Hidden containers for JS compatibility -->
        <div id="image-preview" class="hidden"></div>
        <div id="result" class="hidden"></div>
    </div>
</div>
{% endblock %}
