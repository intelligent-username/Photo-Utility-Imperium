<!-- Background Removal -->

{% extends 'template.html' %}

{% block title %}Background Remover{% endblock %}

{% block bodytag %} data-page="BR"{% endblock %}
{% block content %}
<div class="row">
    <!-- Left Side: Upload -->
    <div class="col-md-4">
        <h2>Background Remover</h2>
        <div class="upload-area" id="uploadfile">
            <div class="upload-icon">
                <i class="fas fa-cloud-upload-alt fa-3x"></i>
            </div>
            <h3>Drag & Drop or Click to Upload Image</h3>
            <input type="file" id="fileInput" accept="image/*">
        </div>
    </div>

    <!-- Right side: preview & result -->
    <div class="col-md-8">
        <!-- Image Preview -->
        <div id="image-preview">
            <h4>Original Image:</h4>
            <img id="preview" src="" alt="Your Image" class="img-fluid hidden">
        </div>

        <!-- Processed Image -->
        <div id="result">
            <h4>Processed Image:</h4>
            <img id="output" src="" alt="Processed Image" class="img-fluid hidden">
            <a id="download-btn" href="" download="processed.png" class="btn btn-primary mt-3 hidden">Download</a>
        </div>
        
    </div>
</div>
{% endblock %}
