<!-- Format Converter -->

{% extends 'template.html' %}

{% block title %}Image Converter{% endblock %}

{% block bodytag %} data-page="FC" {% endblock %}
{% block content %}
<div class="row">
    <!-- Left Side: Upload Area -->
    <div class="col-md-4">
        <h2>Format Converter</h2>
        <div class="upload-area" id="uploadfile">
            <div class="upload-icon">
                <i class="fas fa-cloud-upload-alt fa-3x"></i>
            </div>
            <h3>Drag & Drop or Click to Upload Image</h3>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- Separate File Format Selection -->
        <div class="form-group mt-3">
            <label for="formatSelect">Select Output Format</label>
            <select id="formatSelect" class="form-control">
                <option value="PNG" selected>PNG</option>
                <option value="PDF">PDF</option>
                <option value="JPEG">JPEG</option>
                <option value="WEBP">WEBP</option>
                <option value="GIF">GIF</option>
                <option value="BMP">BMP</option>
                <option value="TIFF">TIFF</option>
                <option value="PPM">PPM</option>
                <option value="EPS">EPS</option>
            </select>
            <button id="convert-again-btn" class="btn btn-primary mt-2 hidden">Convert Again</button>
        </div>
    </div>

    <!-- Right Side: Image Preview and Result -->
    <div class="col-md-8">
        <!-- Image Preview -->
        <div id="image-preview">
            <div class="preview-header">
                <h4>Original Image:</h4>
                <span id="original-name" class="file-name-badge hidden"></span>
            </div>
            <img id="preview" src="" alt="Your Image" class="img-fluid hidden">
        </div>

        <div id="result">
            <div class="preview-header">
                <h4>Converted Image:</h4>
                <span id="converted-name" class="file-name-badge hidden"></span>
            </div>
            <img id="output" src="" alt="Converted Image" class="img-fluid hidden">
            <a id="download-btn" href="" download="converted" class="btn btn-primary mt-3 hidden">Download</a>
        </div>
    </div>
</div>
{% endblock %}
