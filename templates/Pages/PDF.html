{% extends 'template.html' %}

{% block title %}PDF Merger{% endblock %}

{% block bodytag %} data-page="PDF" {% endblock %}
{% block content %}
<div class="row">
    <!-- Left Side: Upload Area -->
    <div class="col-md-6">
        <h2>PDF Merger</h2>
        <div class="upload-area" id="uploadfile">
            <div class="upload-icon">
                <i class="fas fa-cloud-upload-alt fa-3x"></i>
            </div>
            <h3>Drag & Drop or Click to Upload PDFs</h3>
            <input type="file" id="fileInput" accept="application/pdf" multiple>
        </div>
        <div class="form-group mt-3">
            <label for="pages-between">Number of Pages Between PDFs:</label>
            <input type="number" id="pages-between" class="form-control" placeholder="Enter number of pages" value="0">
        </div>
        <div class="d-flex align-items-center mt-3">
            <button id="merge-btn" class="btn btn-success mr-3">Merge PDFs</button>
            <button id="reset-btn" class="btn btn-danger">Reset List</button>
        </div>
        <ul id="file-list" class="list-group mt-3"></ul>
    </div>

    <!-- Right Side: Merged PDF Preview -->
    <div class="col-md-6" style="padding-left: 30px;">
        <h4>Merged PDF Preview</h4>
        <iframe id="merged-pdf-preview" style="width: 100%; height: 600px; border: 1px solid #ccc;" hidden></iframe>
    </div>
</div>
{% endblock %}
