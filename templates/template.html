<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>{% block title %}{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='media/assets/logo.png') }}">
    <!-- App styles -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body class="theme-dark" {% block bodytag%} {% endblock %}>
    <header>
        <nav class="app-navbar" aria-label="Primary">
            <div class="container navbar-inner">
                <a class="app-brand" href="/main">
                    <img class="brand-mark" src="{{ url_for('static', filename='media/assets/logo.png') }}" alt="Logo">
                    <span class="brand-text">Photo Utility Imperium</span>
                </a>
                <ul class="app-nav">
                    <li><a class="nav-link" href="/main"><img
                                src="{{ url_for('static', filename='media/assets/house.svg') }}" alt="Home"
                                class="nav-icon mr-1">Home</a></li>
                    <li><a class="nav-link" href="/BR"><img
                                src="{{ url_for('static', filename='media/assets/scissor.png') }}" alt="Background"
                                class="nav-icon mr-1">Background</a></li>
                    <li><a class="nav-link" href="/IC"><img
                                src="{{ url_for('static', filename='media/assets/compress.svg') }}" alt="Compress"
                                class="nav-icon mr-1">Compress</a></li>
                    <li><a class="nav-link" href="/NR"><img
                                src="{{ url_for('static', filename='media/assets/wand.svg') }}" alt="Noise"
                                class="nav-icon mr-1">Noise</a></li>
                    <li><a class="nav-link" href="/FC"><img
                                src="{{ url_for('static', filename='media/assets/convert.png') }}" alt="Convert"
                                class="nav-icon mr-1">Convert</a></li>
                    <li><a class="nav-link" href="/PDF"><img
                                src="{{ url_for('static', filename='media/assets/pdf.png') }}" alt="PDF"
                                class="nav-icon mr-1">PDF</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Processing overlay -->
    <div id="processing-overlay" aria-hidden="true">
        <div class="processing-box" role="status" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <div class="processing-text">Processing…</div>
        </div>
    </div>

    <main class="container page-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <div class="container footer-inner">
            <div class="footer-text text-muted small">&copy; 2026 intelligent-username</div>
            <div class="footer-links">
                <img src="{{ url_for('static', filename='media/assets/GH_Logo.svg') }}" alt="GitHub"
                    class="footer-github-logo" aria-hidden="true">

                <a href="https://github.com/intelligent-username/Photo-Utility-Imperium" target="_blank" rel="noopener">
                    Repository
                </a>
            </div>
        </div>
    </footer>

    <script type="module" src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>

</html>
