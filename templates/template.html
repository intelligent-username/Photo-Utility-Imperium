<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>{% block title %}{% endblock %}</title>
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='media/assets/logo.png') }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- App styles -->
    <link
      rel="stylesheet"
      type="text/css"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
  </head>

  <body class="theme-dark" {% block bodytag%} {% endblock %}>
    <header>
      <nav class="app-navbar" aria-label="Primary">
        <div class="container navbar-inner">
          <a class="app-brand" href="/main">
            <img
              class="brand-mark"
              src="{{ url_for('static', filename='media/assets/logo.png') }}"
              alt="Logo"
            />
            <span class="brand-text">Photo Utility Imperium</span>
          </a>
          <ul class="app-nav">
            <li>
              <a class="nav-link" href="/main"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="nav-icon mr-1"
                >
                  <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                  <polyline points="9 22 9 12 15 12 15 22" /></svg
                >Home</a
              >
            </li>
            <li>
              <a class="nav-link" href="/BR"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="nav-icon mr-1"
                >
                  <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="2"
                    stroke-dasharray="3 3"
                  />
                  <path d="M16 18a4 4 0 0 0-8 0" />
                  <circle cx="12" cy="11" r="3" /></svg
                >Background</a
              >
            </li>
            <li>
              <a class="nav-link" href="/IC"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="nav-icon mr-1"
                >
                  <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7" /></svg
                >Compress</a
              >
            </li>
            <li>
              <a class="nav-link" href="/NR"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="nav-icon mr-1"
                >
                  <path
                    d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z"
                  />
                  <path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5.5Z" />
                  <path
                    d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1Z"
                  /></svg
                >Denoise</a
              >
            </li>
            <li>
              <a class="nav-link" href="/FC"
                ><img
                  src="{{ url_for('static', filename='media/assets/convert.png') }}"
                  alt="Convert"
                  class="nav-icon mr-1"
                />Convert</a
              >
            </li>
            <li>
              <a class="nav-link" href="/PDF"
                ><img
                  src="{{ url_for('static', filename='media/assets/pdf.png') }}"
                  alt="PDF"
                  class="nav-icon mr-1"
                />PDF</a
              >
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <!-- Processing overlay -->
    <div id="processing-overlay" aria-hidden="true">
      <div class="processing-box" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <div class="processing-text">Processing…</div>
      </div>
    </div>

    <main class="container page-container">
      {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
      <div class="container footer-inner">
        <p class="footer-text">&copy; 2026 intelligent-username</p>
        <a
          href="https://github.com/intelligent-username/Photo-Utility-Imperium"
          target="_blank"
          rel="noopener"
          class="footer-link"
        >
          <svg
            class="footer-github-logo"
            viewBox="0 0 1024 1024"
            width="16"
            height="16"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M8 0C3.58 0 0 3.58 0 8C0 11.54 2.29 14.53 5.47 15.59C5.87 15.66 6.02 15.42 6.02 15.21C6.02 15.02 6.01 14.39 6.01 13.72C4 14.09 3.48 13.23 3.32 12.78C3.23 12.55 2.84 11.84 2.5 11.65C2.22 11.5 1.82 11.13 2.49 11.12C3.12 11.11 3.57 11.7 3.72 11.94C4.44 13.15 5.59 12.81 6.05 12.6C6.12 12.08 6.33 11.73 6.56 11.53C4.78 11.33 2.92 10.64 2.92 7.58C2.92 6.71 3.23 5.99 3.74 5.43C3.66 5.23 3.38 4.41 3.82 3.31C3.82 3.31 4.49 3.1 6.02 4.13C6.66 3.95 7.34 3.86 8.02 3.86C8.7 3.86 9.38 3.95 10.02 4.13C11.55 3.09 12.22 3.31 12.22 3.31C12.66 4.41 12.38 5.23 12.3 5.43C12.81 5.99 13.12 6.7 13.12 7.58C13.12 10.65 11.25 11.33 9.47 11.53C9.76 11.78 10.01 12.26 10.01 13.01C10.01 14.08 10 14.94 10 15.21C10 15.42 10.15 15.67 10.55 15.59C13.71 14.53 16 11.53 16 8C16 3.58 12.42 0 8 0Z"
              transform="scale(64)"
              fill="currentColor"
            />
          </svg>
          Repository
        </a>
      </div>
    </footer>

    <script
      type="module"
      src="{{ url_for('static', filename='js/scripts.js') }}"
    ></script>
  </body>
</html>
