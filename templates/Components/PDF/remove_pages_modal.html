<!-- Remove Pages Modal -->
<div id="pdf-remove-pages-modal" class="pdf-modal-backdrop hidden">
  <div class="pdf-modal-dialog remove-pages-dialog">
    <div class="pdf-modal-header remove-pages-header">
      <div class="modal-title-with-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        <h3>Remove Pages</h3>
      </div>
      <button id="close-remove-pages-modal-btn" class="pdf-modal-close" type="button" title="Close">&times;</button>
    </div>
    <div class="pdf-modal-body remove-pages-body">
      <div class="remove-pages-meta">
        <span class="remove-meta-label">Total pages</span>
        <span class="remove-meta-count"><strong id="remove-modal-total-pages">0</strong></span>
      </div>
      <input type="text" id="remove-pages-input" name="remove-pages-input" class="remove-pages-input" placeholder="3-10, 12-20, odd pages, last page…" autocomplete="off" />
      <div id="remove-pages-feedback" class="remove-pages-feedback" style="display: none;"></div>
    </div>
    <div class="pdf-modal-footer remove-pages-footer">
      <button id="cancel-remove-pages-modal-btn" class="btn btn-secondary" type="button">Cancel</button>
      <button id="confirm-remove-pages-btn" class="btn btn-danger" type="button" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        Remove
      </button>
    </div>
  </div>
</div>
