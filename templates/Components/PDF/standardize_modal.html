<!-- Standardize Modal (same as FC, minimal) -->
<div id="pdf-standardize-modal" class="pdf-modal-backdrop hidden">
  <div class="pdf-modal-dialog">
    <div class="pdf-modal-header">
      <h3>Standardize Size</h3>
      <button id="close-pdf-standardize-modal-btn" class="pdf-modal-close" type="button">&times;</button>
    </div>
    <div class="pdf-modal-body">
      <p class="mb-2" style="font-size:0.9rem;color:var(--muted);">Select standard page size:</p>
      <div class="size-options-grid">
        <label class="size-option-card active" for="pdf-size-us-letter" data-size="US Letter">
          <input type="radio" name="pdfPageSizeChoice" id="pdf-size-us-letter" value="US Letter" checked />
          <div class="size-option-details"><span class="size-option-name">US Letter</span><span class="size-option-dims">8.5 × 11.0 in (612 × 792 pt)</span></div>
        </label>
        <label class="size-option-card" for="pdf-size-eu-a4" data-size="International (A4)">
          <input type="radio" name="pdfPageSizeChoice" id="pdf-size-eu-a4" value="International (A4)" />
          <div class="size-option-details"><span class="size-option-name">International (A4)</span><span class="size-option-dims">210 × 297 mm (595 × 842 pt)</span></div>
        </label>
      </div>
    </div>
    <div class="pdf-modal-footer">
      <button id="cancel-pdf-standardize-modal-btn" class="btn btn-secondary" type="button">Cancel</button>
      <button id="apply-pdf-standardize-modal-btn" class="btn btn-primary" type="button">Standardize</button>
    </div>
  </div>
</div>
