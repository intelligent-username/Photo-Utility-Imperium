      <!-- Primary Toolbar -->
      <div class="pdf-toolbar" id="pdf-toolbar">
        <div class="toolbar-group">
          <button id="annotate-btn" class="pdf-toolbar-btn" data-tooltip="`A`&#10;Annotate (Text, Sign, Date)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            <span>Annotate</span>
          </button>
          <button id="crop-btn" class="pdf-toolbar-btn" data-tooltip="`C`&#10;Crop (Set crop region)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"></path>
              <path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"></path>
            </svg>
            <span>Crop</span>
          </button>
          <button id="overlay-btn" class="pdf-toolbar-btn" data-tooltip="`O`&#10;Overlay (Merge pages)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
              <polyline points="2 17 12 22 22 17"></polyline>
              <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
            <span>Overlay</span>
          </button>
          <button id="remove-pages-btn" class="pdf-toolbar-btn" data-tooltip="Remove pages (e.g. 3-10, odd pages, even pages)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
            <span>Remove</span>
          </button>
          <button id="whiteout-btn" class="pdf-toolbar-btn" data-tooltip="`W`&#10;Whiteout (Cover content)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            </svg>
            <span>Whiteout</span>
          </button>
          <button id="field-form-btn" class="pdf-toolbar-btn" data-tooltip="`F`&#10;Field Form (Edit / Create / Delete)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="10" rx="2" ry="2"></rect>
              <line x1="6" y1="12" x2="10" y2="12"></line>
            </svg>
            <span>Field Form</span>
          </button>
        </div>
        <div class="toolbar-sep"></div>
        <div class="toolbar-group">
          <button id="restore-all-btn" class="pdf-toolbar-btn" data-tooltip="`R` `R` `R`&#10;Reset All (Restore pages)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            <span>Reset All</span>
          </button>
        </div>
        <div class="toolbar-group toolbar-group-right">
          <button id="view-mode-btn" class="pdf-toolbar-btn active" data-tooltip="`V`&#10;Cycle view mode (Large / Full / Small)">Large View</button>
        </div>
      </div>
